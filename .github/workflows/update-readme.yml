name: Update README

on:
  schedule:
    - cron: "0 17 * * *" # daily at 00:00 WIB (17:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/update-releases.mjs
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Admin PAT: the 'main' ruleset (PR + CodeQL required) only lets repo
          # admins bypass it, and GITHUB_TOKEN can't be added as a bypass actor
          # on a personal repo.
          token: ${{ secrets.README_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh latest releases
        run: node .github/scripts/update-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest releases"
          git push
